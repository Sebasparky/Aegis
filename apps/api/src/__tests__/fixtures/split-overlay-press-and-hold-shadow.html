<!doctype html>
<!--
  Screen-level (split-overlay) human-verification fixture — shadow-DOM variant.

  Same SHAPE as split-overlay-press-and-hold.html (textless full-page dimmer in
  the light DOM + a SEPARATE foreground challenge card), but the card's text AND
  its press-hold control live inside an OPEN shadow root, and the control is a
  bare <div> (not a <button>) — the modern HUMAN/PerimeterX widget shape.

  The OLD scanner used document.querySelectorAll, which does NOT pierce shadow
  roots, so the challenge text was never harvested (hv_phrase_seen=false) even
  though the light-DOM dimmer was detected as the blocker. The widened scan
  enumerates open shadow roots (one level) and reads the card text.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <title>Wallflowers &amp; Diffusers</title>
    <style>
      body { font-family: sans-serif; margin: 0; }
      header { display: flex; gap: 12px; padding: 16px; border-bottom: 1px solid #ddd; }
      .grid { display: flex; gap: 16px; padding: 24px; }
      .card { width: 180px; }
      /* Full-page dimmer — blocking, textless, light DOM (so fixedCoverage sees it). */
      #hv-dimmer {
        position: fixed; inset: 0; z-index: 9998;
        background: rgba(20, 20, 20, 0.45);
      }
    </style>
  </head>
  <body>
    <header>
      <input id="search" type="search" placeholder="Search products" aria-label="Search products" />
      <button id="search-btn">Search</button>
      <a id="cart-link" href="/cart">Cart</a>
    </header>
    <main>
      <h1>Wallflowers &amp; Diffusers</h1>
      <div class="grid">
        <div class="card"><a href="/p/mahogany">Mahogany Teakwood Intense</a></div>
        <div class="card"><a href="/p/champagne">Champagne Toast</a></div>
        <div class="card"><a href="/p/clean-house">Clean House Vibes</a></div>
      </div>
    </main>

    <!-- Light-DOM textless dimmer + a host whose OPEN shadow root holds the card. -->
    <div id="hv-dimmer"></div>
    <div id="hv-host"></div>

    <script>
      (function () {
        var host = document.getElementById("hv-host");
        var root = host.attachShadow({ mode: "open" });
        root.innerHTML =
          '<style>' +
          '  #hv-card{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);' +
          '    width:360px;padding:32px 40px;background:#fff;border-radius:10px;text-align:center;}' +
          '  #hv-hold-btn{margin-top:18px;padding:12px 40px;font-size:15px;border:1px solid #2f6fde;' +
          '    border-radius:22px;background:#fff;color:#2f6fde;cursor:pointer;' +
          '    user-select:none;-webkit-user-select:none;display:inline-block;}' +
          '</style>' +
          '<div id="hv-card">' +
          '  <h2>Before we continue...</h2>' +
          '  <p>Press &amp; Hold to confirm you are a human (and not a bot).</p>' +
          '  <div id="hv-hold-btn" role="button" tabindex="0">Press &amp; Hold</div>' +
          '  <p id="hv-status" style="font-size:12px;color:#888;">Reference ID 77d28970-677f-11f1-a659</p>' +
          '</div>';
      })();
    </script>
  </body>
</html>

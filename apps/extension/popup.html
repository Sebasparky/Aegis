<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aegis Recorder</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
      background: #0f1117;
      color: #e2e8f0;
      width: 260px;
      min-height: 160px;
      padding: 16px;
    }

    header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
    }

    header svg {
      flex-shrink: 0;
    }

    header span {
      font-weight: 600;
      font-size: 14px;
      letter-spacing: 0.01em;
      color: #f8fafc;
    }

    .status-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 6px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
      background: #475569;
      transition: background 0.2s;
    }

    .dot.recording {
      background: #22c55e;
      box-shadow: 0 0 0 2px rgba(34, 197, 94, 0.25);
      animation: pulse 1.8s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.5; }
    }

    #status-text {
      font-weight: 500;
      color: #cbd5e1;
    }

    #domain-text {
      font-size: 11px;
      color: #64748b;
      margin-bottom: 10px;
      min-height: 14px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #event-count {
      font-size: 11px;
      color: #64748b;
      margin-bottom: 14px;
      min-height: 14px;
    }

    #event-count span {
      color: #94a3b8;
      font-weight: 500;
    }

    button {
      width: 100%;
      padding: 8px 0;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.15s, background 0.15s;
    }

    button:active { opacity: 0.8; }

    #toggle-btn.idle {
      background: #2563eb;
      color: #fff;
    }

    #toggle-btn.recording {
      background: #1e293b;
      color: #f87171;
      border: 1px solid #374151;
    }
  </style>
</head>
<body>
  <header>
    <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="9" cy="9" r="8" stroke="#3b82f6" stroke-width="1.5"/>
      <path d="M6 9l2 2 4-4" stroke="#3b82f6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span>Aegis Recorder</span>
  </header>

  <div class="status-row">
    <div class="dot" id="dot"></div>
    <span id="status-text">Idle</span>
  </div>

  <div id="domain-text"></div>
  <div id="event-count">Events captured: <span id="count">0</span></div>

  <button id="toggle-btn" class="idle">Start Recording</button>

  <script src="popup.js"></script>
</body>
</html>
